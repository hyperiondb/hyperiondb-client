[package]
name = "hyperiondb-client"
version = "0.2.1"
edition = "2021"
publish = false
description = "Native Node.js client for a HyperionDb / pg_replica Postgres cluster"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "=3.9.0", default-features = false, features = ["napi6", "async", "serde-json"] }
napi-derive = "=3.5.6"
tokio-postgres = { version = "=0.7.17", features = ["with-serde_json-1", "with-uuid-1", "with-time-0_3"] }
deadpool-postgres = "=0.14.1"
tokio = { version = "=1.52.3", features = ["time", "sync", "macros"] }
serde_json = "=1.0.150"
bytes = "=1.11.1"
time = "=0.3.47"
uuid = "=1.23.2"

[build-dependencies]
napi-build = "=2.3.2"

[profile.release]
lto = true
strip = "symbols"
